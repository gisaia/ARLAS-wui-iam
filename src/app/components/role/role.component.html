<arlas-iam-top-menu [pages]="pages" [showCreate]="true" (createEvent)="add()"></arlas-iam-top-menu>

<div class="content">
  <table mat-table class="table" [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> {{'Name' | translate}} </th>
      <td mat-cell *matCellDef="let row">{{row.name}}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> {{'Description' | translate}} </th>
      <td mat-cell *matCellDef="let row">{{row.description | translate}}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> {{'Actions' | translate}} </th>
      <td mat-cell *matCellDef="let row">
        @if (!row.isTechnical) {
          <mat-icon [matMenuTriggerFor]="menu" class="actions-menu">
            more_vert
          </mat-icon>
        }
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="editRole(row.id)">
            <mat-icon class="button-actions">edit</mat-icon>
            {{'Edit' | translate}}
          </button>
          <button mat-menu-item (click)="deleteRole(row.id, row.name)">
            <mat-icon class="button-actions">delete</mat-icon>
            {{'Delete' | translate}}
          </button>
        </mat-menu>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  <mat-paginator class="mat-paginator-sticky" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
</div>
