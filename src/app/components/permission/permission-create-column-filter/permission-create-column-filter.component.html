<arlas-iam-top-menu [pages]="pages"></arlas-iam-top-menu>

<form [formGroup]="permForm" class="create-perm">
  <div class="form-content">
    <h3>{{'Information' | translate}}</h3>
    <mat-form-field appearance="outline" class="name">
      <mat-label>{{'Collections' | translate}}</mat-label>
      <mat-select [multiple]="true" formControlName="collections" required>
        @for (collect of collections; track collect) {
          <mat-option [value]="collect">
            {{collect}}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div>
    <button matButton="outlined" type="button" (click)="back()" tabindex="-1"> {{'Cancel' | translate}}</button>
    <button matButton="filled" color="accent" [disabled]="!permForm.valid" (click)="submit()" tabindex="-1">
      {{ isCreateMode ? 'Create' : 'Save' | translate}}
    </button>
  </div>
</form>
